version: '3'

vars:
  REGISTRY: ghcr.io/host-uk
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  # ============================================================
  # Build All
  # ============================================================
  build:
    desc: Build all images (Docker + TIM)
    deps:
      - build:developer
      - build:server-php
      - build:scanner-go

  build:docker:
    desc: Build all Docker images
    deps:
      - build:developer:docker
      - build:server-php:docker
      - build:scanner-go:docker

  build:tim:
    desc: Build all TIM bundles
    deps:
      - build:developer:tim
      - build:server-php:tim

  # ============================================================
  # Developer Image
  # ============================================================
  build:developer:
    desc: Build developer image (Docker + TIM)
    deps:
      - build:developer:docker
      - build:developer:tim

  build:developer:docker:
    desc: Build developer Docker image
    dir: developer
    cmds:
      - |
        docker build \
          --tag {{.REGISTRY}}/core-dev:{{.VERSION}} \
          --tag {{.REGISTRY}}/core-dev:latest \
          --build-arg VERSION={{.VERSION}} \
          .

  build:developer:tim:
    desc: Build developer TIM bundle
    dir: developer
    cmds:
      - echo "TODO: core build --type tim -o ../dist/core-dev-{{OS}}-{{ARCH}}.tim"

  push:developer:
    desc: Push developer image to registry
    cmds:
      - docker push {{.REGISTRY}}/core-dev:{{.VERSION}}
      - docker push {{.REGISTRY}}/core-dev:latest

  # ============================================================
  # Server PHP Image
  # ============================================================
  build:server-php:
    desc: Build server-php image (Docker + TIM)
    deps:
      - build:server-php:docker
      - build:server-php:tim

  build:server-php:docker:
    desc: Build server-php Docker image
    dir: server-php
    cmds:
      - |
        docker build \
          --tag {{.REGISTRY}}/server-php:{{.VERSION}} \
          --tag {{.REGISTRY}}/server-php:latest \
          --build-arg VERSION={{.VERSION}} \
          .

  build:server-php:tim:
    desc: Build server-php TIM bundle
    dir: server-php
    cmds:
      - echo "TODO: core build --type tim -o ../dist/server-php-{{OS}}-{{ARCH}}.tim"

  push:server-php:
    desc: Push server-php image to registry
    cmds:
      - docker push {{.REGISTRY}}/server-php:{{.VERSION}}
      - docker push {{.REGISTRY}}/server-php:latest

  # ============================================================
  # Scanner Go Image
  # ============================================================
  build:scanner-go:
    desc: Build scanner-go image (Docker + TIM)
    deps:
      - build:scanner-go:docker
      - build:scanner-go:tim

  build:scanner-go:docker:
    desc: Build scanner-go Docker image
    dir: scanner-go
    cmds:
      - |
        docker build \
          --tag {{.REGISTRY}}/core-scanner-go:{{.VERSION}} \
          --tag {{.REGISTRY}}/core-scanner-go:latest \
          --build-arg VERSION={{.VERSION}} \
          .

  build:scanner-go:tim:
    desc: Build scanner-go TIM bundle
    dir: scanner-go
    cmds:
      - echo "TODO: core build --type tim -o ../dist/core-scanner-go-{{OS}}-{{ARCH}}.tim"

  push:scanner-go:
    desc: Push scanner-go image to registry
    cmds:
      - docker push {{.REGISTRY}}/core-scanner-go:{{.VERSION}}
      - docker push {{.REGISTRY}}/core-scanner-go:latest

  scan:
    desc: "Run full scan against /src (mount your repo: -v \$(pwd):/src)"
    cmds:
      - docker run --rm -v {{.CLI_ARGS}}:/src {{.REGISTRY}}/core-scanner-go:latest sh -c "cd /src && govulncheck ./... && gosec ./... && golangci-lint run ./... && trivy fs ."

  # ============================================================
  # Release
  # ============================================================
  release:
    desc: Build and push all images
    cmds:
      - task: build
      - task: push:developer
      - task: push:server-php
      - task: push:scanner-go

  # ============================================================
  # Utilities
  # ============================================================
  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf dist/
      - docker rmi {{.REGISTRY}}/core-dev:{{.VERSION}} || true
      - docker rmi {{.REGISTRY}}/server-php:{{.VERSION}} || true
      - docker rmi {{.REGISTRY}}/core-scanner-go:{{.VERSION}} || true

  dist:
    desc: Create dist directory
    cmds:
      - mkdir -p dist
    status:
      - test -d dist
